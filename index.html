<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phonix | Official Website</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background: #0b0b0f;
      color: #fff;
    }

    header {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1a1a1f, #000);
      text-align: center;
    }

    header h1 {
      font-size: 5rem;
      letter-spacing: 10px;
    }

    header p {
      margin-top: 15px;
      color: #aaa;
      letter-spacing: 3px;
    }

    .btn {
      margin-top: 30px;
      padding: 12px 25px;
      border: 1px solid #ff4d00;
      color: #ff4d00;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff4d00;
      color: #000;
    }

    section {
      padding: 80px 20px;
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      letter-spacing: 3px;
    }

    p {
      color: #bbb;
      line-height: 1.6;
    }

    .links a {
      display: inline-block;
      margin: 10px;
      color: #ff4d00;
      text-decoration: none;
      font-size: 18px;
    }

    footer {
      padding: 40px;
      text-align: center;
      color: #555;
      border-top: 1px solid #222;
    }
  </style>
</head>

<body>

<header>
  <h1>PHONIX</h1>
  <p>FUNK • R&B • LIVE ENERGY</p>
  <a class="btn" href="#music">Enter</a>
</header>

<section id="music">
  <h2>The Sound</h2>
  <p>
    Phonix è una band che unisce groove funk, R&B moderno e energia live.
    Un suono internazionale pensato per il palco.
  </p>
</section>

<section>
  <h2>Live</h2>
  <p>Prossime date in arrivo. Stay tuned.</p>
</section>

<section>
  <h2>Connect</h2>
  <div class="links">
    <a href="#">Instagram</a>
    <a href="#">Spotify</a>
    <a href="mailto:phonix@email.com">Email</a>
  </div>
</section>

<footer>
  © 2026 Phonix. All rights reserved.
</footer>

</body>
</html>
